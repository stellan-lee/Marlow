name: teams-platform
label: Microsoft Teams
kind: platform
version: 1.0.0
description: >
  Microsoft Teams gateway adapter for Marlow Agent.
  Supports authenticated single-tenant personal chats, group chats,
  and standard Teams channel threads through the Bot Framework channel.
author: Marlow contributors
requires_env:
  - name: TEAMS_CLIENT_SECRET
    description: "Microsoft Teams bot client secret"
    prompt: "Microsoft Teams bot client secret"
    url: "https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade"
    password: true
optional_env:
  - name: TEAMS_ALLOWED_USERS
    description: "Comma-separated Azure AD object IDs allowed to talk to the bot"
    prompt: "Allowed Azure AD object IDs (comma-separated)"
    password: false
  - name: TEAMS_ALLOW_ALL_USERS
    description: "Allow any authenticated user in the configured tenant"
    prompt: "Allow all users in the configured tenant? (true/false)"
    password: false
  - name: TEAMS_REACTIONS
    description: "Enable best-effort Microsoft Teams acknowledgement reactions"
    prompt: "Enable Teams acknowledgement reactions? (true/false)"
    password: false
